<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reactive Fun Backgrounds - Party Visuals & Animated Screensavers</title>
  <meta name="description" content="Free browser-based reactive party visuals and animated screensavers. Jellyfish aquarium, beat-reactive animations, and more. Go fullscreen and vibe.">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- ===== Selection Screen ===== -->
  <div id="selection-screen">
    <header>
      <h1>Reactive Fun Backgrounds</h1>
      <p class="tagline">Pick a visual. Go fullscreen. Vibe.</p>
    </header>

    <div id="visual-grid">
      <!-- Cards are injected by JS from the visual registry -->
    </div>
  </div>

  <!-- ===== Visual Viewport (hidden until a visual is launched) ===== -->
  <div id="visual-viewport" class="hidden">
    <canvas id="visual-canvas"></canvas>

    <!-- Floating HUD – auto-hides after inactivity -->
    <div id="hud">
      <button id="btn-back" title="Back to menu">&larr; Back</button>
      <button id="btn-mic" title="Enable microphone for beat detection">Mic: OFF</button>
      <button id="btn-fullscreen" title="Toggle fullscreen">Fullscreen</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
